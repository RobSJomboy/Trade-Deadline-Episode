<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Talkin' Baseball — Trade Reaction DISPLAY</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&display=swap');

  /* ---------- Optional brand font ----------
     If you have the Rift font files, drop rift-bold.woff2 (etc) next to
     this file and uncomment this block + the font-family lines below.
  ---------- */
  /*
  @font-face{
    font-family:'Rift';
    src:url('Rift-Bold.woff2') format('woff2');
    font-weight:700;
  }
  */

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:1920px; height:1080px;
    background:transparent;
    overflow:hidden;
    font-family:'Barlow Condensed', 'Rift', Arial, sans-serif;
  }
  #stage{ position:relative; width:1920px; height:1080px; }

  /* ================= PLAYER / ARROW / TEAM ================= */
  #tradeRow{
    position:absolute;
    left:0; top:0; width:1920px; height:1080px;
    pointer-events:none;
  }

  /* Geometry note: the ticker is 55px tall (border-box, incl. its 3px rules) and
     floats 100px off the bottom, so it occupies y=925..980 and its TOP edge is y=925.
     The name tags sit at y=879 and run ~31px tall, putting the bottom of the whole
     player/arrow/team group at y=910 — 15px of air above the ticker. Move or resize
     the ticker and every number in this block has to move with it, or the gap drifts
     (too small and the bar rides over the name tags; too large and the group floats).
     The trade-count badge's `bottom` is tied to the same y=910 line. */
  .headshotWrap, .logoWrap{
    position:absolute;
    top:626px;
    width:240px; height:240px;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transform:translateY(650px);
    transition: transform 750ms cubic-bezier(.2,.8,.2,1), opacity 750ms cubic-bezier(.2,.8,.2,1);
  }
  /* Group is centred on x=960: 240 + 30 gap + 250 arrow + 30 gap + 240 = 790 wide. */
  .headshotWrap{ left:565px; }
  .logoWrap{ left:1115px; }

  .headshotWrap.show, .logoWrap.show{
    opacity:1;
    transform:translateY(0);
  }

  .headshotWrap img{
    width:240px; height:240px; object-fit:cover; border-radius:12px;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.55));
    background:#0f2540;
  }
  .logoWrap img{
    width:210px; height:210px; object-fit:contain;
    filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 0 #fff) drop-shadow(0 10px 24px rgba(0,0,0,.55));
  }
  .logoWrap img.svglogo{
    filter:
      drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff)
      drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)
      drop-shadow(0 10px 24px rgba(0,0,0,.55));
  }

  #nameTag{
    position:absolute;
    left:565px; top:879px; width:240px;
    text-align:center;
    color:#fff;
    font-weight:800;
    font-size:26px;
    letter-spacing:.5px;
    text-shadow:0 3px 10px rgba(0,0,0,.6);
    opacity:0;
    transform:translateY(20px);
    transition: transform 750ms cubic-bezier(.2,.8,.2,1), opacity 750ms cubic-bezier(.2,.8,.2,1);
  }
  #nameTag.show{ opacity:1; transform:translateY(0); }

  #teamNameTag{
    position:absolute;
    left:1115px; top:879px; width:240px;
    text-align:center;
    color:#fff;
    font-weight:800;
    font-size:26px;
    letter-spacing:.5px;
    text-shadow:0 3px 10px rgba(0,0,0,.6);
    opacity:0;
    transform:translateY(20px);
    transition: transform 750ms cubic-bezier(.2,.8,.2,1), opacity 750ms cubic-bezier(.2,.8,.2,1);
  }
  #teamNameTag.show{ opacity:1; transform:translateY(0); }

  /* Arrow between headshot and logo. Images span y=626..866, so centre is y=746;
     at 70px tall that puts the top at 711. viewBox stays 390x110 — the SVG just scales. */
  #arrowWrap{
    position:absolute;
    left:835px; top:711px;
    width:250px; height:70px;
    opacity:0;
    transform:scaleX(.6);
    transform-origin:left center;
    transition: transform 750ms cubic-bezier(.2,.8,.2,1), opacity 750ms cubic-bezier(.2,.8,.2,1);
  }
  #arrowWrap.show{ opacity:1; transform:scaleX(1); }
  #arrowWrap svg{ width:100%; height:100%; filter: drop-shadow(0 6px 14px rgba(0,0,0,.55)); }

  /* The corner logo bug is gone; the same artwork is now the ticker separator.
     #tickerLogoSrc holds the base64 so the markup keeps exactly one copy of it —
     the script converts that to a blob: URL once and points each separator at it. */
  #tickerLogoSrc{ display:none; }

  /* ================= TRADE COUNT ================= */
  /* Sits above the ticker on the left, flush with the bar's left edge (x=10) and
     bottom-aligned 15px above its top edge — bottom:170px == y=910, same line the
     name tags sit on. Anchored by `bottom` so the badge grows upward and that 15px
     holds no matter how tall the content gets. */
  #tradeCount{
    position:absolute;
    left:10px; bottom:170px;
    display:flex; align-items:center; gap:14px;
    background:#173a56;
    color:#fff;
    padding:10px 22px;
    border-radius:6px;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    opacity:0;
    transform:translateY(14px);
    transition: transform 500ms cubic-bezier(.2,.8,.2,1), opacity 500ms cubic-bezier(.2,.8,.2,1);
  }
  #tradeCount.show{ opacity:1; transform:translateY(0); }
  .tcLabel{
    font-weight:800;
    font-size:16px;
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:.75;
  }
  /* tabular-nums so the badge doesn't jump width when the count rolls 9 -> 10 */
  .tcNum{
    font-weight:900;
    font-size:40px;
    line-height:1;
    font-variant-numeric: tabular-nums;
    font-feature-settings:"tnum" 1;
  }

  /* ================= TICKER ================= */
  /* Floats 100px off the bottom, inset 10px each side. The 3px rules are top and
     bottom ONLY — the left and right edges stay pure white with no stroke.
     box-sizing:border-box keeps the 55px total honest with the borders included.

     Halved from 110px to 55px. Anchored by `bottom`, so the bottom edge and both
     side insets don't move — only the top edge comes down, 870 -> 925. Everything
     inside is halved to match; the 3px rules are deliberately NOT halved, since
     that width was asked for outright and 1.5px reads as a hairline on air. */
  #tickerBar{
    position:absolute;
    left:10px; right:10px; bottom:100px; height:55px;
    box-sizing:border-box;
    border-top:3px solid #173a56;
    border-bottom:3px solid #173a56;
    background:#ffffff;
    opacity:0;
    transition: opacity 750ms cubic-bezier(.2,.8,.2,1);
    display:flex; align-items:stretch;
    overflow:hidden;
    box-shadow: 0 3px 9px rgba(0,0,0,.28);
  }
  #tickerBar.show{ opacity:1; }

  /* Navy block on the left: TRADE TRACKER on top, deadline countdown beneath it. */
  #tickerLeft{
    flex:0 0 auto;
    background:#173a56;
    color:#fff;
    display:flex; flex-direction:column;
    align-items:flex-start; justify-content:center;
    gap:3px;
    padding:0 15px;
  }
  #tickerLabel{
    font-weight:900;
    font-size:15px;
    line-height:1;
    letter-spacing:.5px;
    white-space:nowrap;
    text-transform:uppercase;
  }

  #tickerCountdown{
    display:flex; align-items:baseline; gap:5px;
    white-space:nowrap;
    line-height:1;
  }
  #tickerCountdown.hidden{ display:none; }
  .cdLabel{
    font-weight:800;
    font-size:8px;
    letter-spacing:.8px;
    text-transform:uppercase;
    opacity:.72;
  }
  /* tabular-nums stops the clock from shivering as digit widths change each second */
  .cdTime{
    font-weight:900;
    font-size:13px;
    letter-spacing:.25px;
    font-variant-numeric: tabular-nums;
    font-feature-settings:"tnum" 1;
  }

  #tickerTrack{
    flex:1 1 auto;
    align-self:stretch;
    overflow:hidden;
    position:relative;
  }
  #tickerInner{
    position:absolute;
    top:0; left:0;
    height:100%;
    display:flex;
    align-items:center;
    white-space:nowrap;
    will-change: transform, opacity;
    animation: tickerScroll linear infinite;
    /* Content swaps fade rather than hard-cutting. Opacity is animated here while
       the scroll animation drives transform — separate properties, no conflict. */
    opacity:1;
    transition: opacity 260ms ease;
  }
  #tickerInner.swapping{ opacity:0; }

  .tickerItem{
    display:inline-flex;
    align-items:center;
    color:#173a56;
    font-weight:800;
    font-size:17px;
    letter-spacing:.15px;
    padding:0 24px;
    white-space:nowrap;
    text-transform:uppercase;
  }
  .tickerItem .arrow{
    margin:0 8px;
    font-weight:900;
    color:#d81e1e;
  }
  /* Talkin' Baseball mark between every item, in place of the old bullet dot */
  .tickerLogo{
    flex:0 0 auto;
    width:23px; height:23px;
    object-fit:contain;
    display:block;
  }

  @keyframes tickerScroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  /* ================= PASSAN ALERT ================= */
  #alertFlash{
    position:absolute;
    left:0; top:0; width:1920px; height:1080px;
    background:radial-gradient(circle, rgba(216,30,30,.0) 0%, rgba(216,30,30,0) 100%);
    opacity:0;
    pointer-events:none;
  }
  #alertBanner{
    position:absolute;
    top:60px; left:50%;
    transform:translate(-50%,-140px);
    background:#d81e1e;
    color:#fff;
    font-weight:900;
    font-size:44px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:20px 56px;
    border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
    opacity:0;
    transition: transform 450ms cubic-bezier(.2,.8,.2,1), opacity 450ms cubic-bezier(.2,.8,.2,1);
  }
  #alertBanner.show{
    opacity:1;
    transform:translate(-50%,0);
  }
  @keyframes flashPulse{
    0%{ background:radial-gradient(circle, rgba(216,30,30,.0) 0%, rgba(216,30,30,0) 100%); }
    50%{ background:radial-gradient(circle, rgba(216,30,30,.18) 0%, rgba(216,30,30,0) 70%); }
    100%{ background:radial-gradient(circle, rgba(216,30,30,.0) 0%, rgba(216,30,30,0) 100%); }
  }
  #alertFlash.pulse{ animation: flashPulse 900ms ease-out 3; }

</style>
</head>

  const passanAudio          = document.getElementById('passanAudio');

  let lastAlertNonce = null;
  let lastTickerSig = null;

  /* The mark is a ~70KB data URI. Referencing it directly in every separator would
     duplicate that whole string dozens of times in the DOM (items x2 for the seamless
     loop), so convert it once to a short blob: URL and point each <img> at that. */
  const tickerLogoUrl = (() => {
    try{
      const comma = tickerLogoRaw.indexOf(',');
      const mime = (tickerLogoRaw.slice(0, comma).match(/:(.*?);/) || [null,'image/png'])[1];
      const bin = atob(tickerLogoRaw.slice(comma + 1));
      const bytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return URL.createObjectURL(new Blob([bytes], {type: mime}));
    }catch(e){
      return tickerLogoRaw; // fall back to the raw data URI rather than losing the logo
    }
  })();

  /* ---------------- deadline countdown ----------------
     Monday 3 August 2026, 6:00pm ET. Written with an explicit -04:00 offset (3 Aug
     falls inside EDT) so it resolves to the same instant no matter what timezone the
     machine running OBS happens to be set to — no reliance on local time at all.

     Each display ticks this locally off a fixed target, so nothing crosses the network
     once a second; only the show/hide flag syncs through Firebase. Recomputing from the
     target every tick (rather than decrementing a counter) means a throttled or stalled
     interval just skips frames instead of drifting permanently behind. */
  const DEADLINE_MS = Date.parse('2026-08-03T18:00:00-04:00');

  function pad2(n){ return String(n).padStart(2, '0'); }

  function renderCountdown(){
    const remaining = DEADLINE_MS - Date.now();
    if(remaining <= 0){ cdTime.textContent = 'PASSED'; return; }
    const total = Math.floor(remaining / 1000);
    const d = Math.floor(total / 86400);
    const h = Math.floor((total % 86400) / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    cdTime.textContent = (d > 0 ? d + 'D ' : '') + pad2(h) + ':' + pad2(m) + ':' + pad2(s);
  }
  renderCountdown();
  setInterval(renderCountdown, 1000);

  function applyState(state){
    if(!state) return;

    // Player
    if(state.showPlayer && state.player){
      headshotImg.src = headshotUrl(state.player.id);
      nameTag.textContent = state.player.name || '';
      headshotWrap.classList.add('show');
      nameTag.classList.add('show');
    } else {
      headshotWrap.classList.remove('show');
      nameTag.classList.remove('show');
    }

    // Team
    if(state.showTeam && state.team){
      logoImg.src = logoUrl(state.team.id);
      teamNameTag.textContent = state.team.name || '';
      logoWrap.classList.add('show');
      teamNameTag.classList.add('show');
    } else {
      logoWrap.classList.remove('show');
      teamNameTag.classList.remove('show');
    }

    // Arrow shows whenever either side is showing
    if((state.showPlayer && state.player) || (state.showTeam && state.team)){
      arrowWrap.classList.add('show');
    } else {
      arrowWrap.classList.remove('show');
    }

    // (state.showLogoBug is ignored — the corner bug was removed; the logo now
    //  lives between ticker items. Older control panels may still publish the key.)

    // Deadline countdown — only its visibility is synced; the clock runs locally.
    if(state.showCountdown){ tickerCountdown.classList.remove('hidden'); }
    else { tickerCountdown.classList.add('hidden'); }

    // Trade count. Coerced defensively: RTDB can hand back a string, and a missing
    // key must read as 0 rather than painting "NaN" or "undefined" on air.
    const tc = Math.max(0, Math.floor(Number(state.tradeCount)) || 0);
    tcNum.textContent = tc;
    if(state.showTradeCount){ tradeCount.classList.add('show'); }
    else { tradeCount.classList.remove('show'); }

    // Ticker
    const t = state.ticker || {items:[], visible:false, speed:60};
    if(t.visible){ tickerBar.classList.add('show'); }
    else { tickerBar.classList.remove('show'); }

    // RTDB hands back a sparse array as an index-keyed object, and drops it entirely when empty
    const items = Array.isArray(t.items) ? t.items : (t.items ? Object.values(t.items) : []);
    const sig = JSON.stringify(items) + '|' + (t.speed||60);
    if(sig !== lastTickerSig){
      lastTickerSig = sig;
      renderTicker(items, t.speed||60);
    }

    // Passan alert
    if(typeof state.alertNonce !== 'undefined'){
      if(lastAlertNonce === null){
        lastAlertNonce = state.alertNonce; // don't fire on first load
      } else if(state.alertNonce !== lastAlertNonce){
        lastAlertNonce = state.alertNonce;
        fireAlert();
      }
    }
  }

  let tickerPainted = false;
  let tickerSwapToken = 0;

  /* Repainting restarts the scroll from x=0, which used to land as a hard jump the
     moment a name was added. Now the track fades out, swaps, and fades back in. */
  function renderTicker(items, speed){
    // First paint has nothing to fade from, and #tickerBar's own fade-in covers it.
    if(!tickerPainted){
      tickerPainted = true;
      paintTicker(items, speed);
      return;
    }
    const token = ++tickerSwapToken;
    tickerInner.classList.add('swapping');
    setTimeout(() => {
      if(token !== tickerSwapToken) return; // a newer update already superseded this one
      paintTicker(items, speed);
      // Un-fade on a timer rather than requestAnimationFrame. OBS stalls rAF whenever
      // a Browser Source isn't actively rendering, and a stalled callback here would
      // strand the track at opacity 0 — an invisible ticker mid-show. setTimeout still
      // fires (throttled at worst) when a tab or source is backgrounded.
      setTimeout(() => {
        if(token === tickerSwapToken) tickerInner.classList.remove('swapping');
      }, 30);
    }, 260); // matches the opacity transition on #tickerInner
  }

  function paintTicker(items, speed){
    if(!items.length){
      tickerInner.innerHTML = '';
      tickerInner.style.animation = 'none';
      return;
    }
    const sep = `<img class="tickerLogo" src="${tickerLogoUrl}" alt="">`;
    const pieceHtml = items.map(txt => `<span class="tickerItem">${escapeHtml(txt)}</span>${sep}`).join('');
    // duplicate content so the 50%-translate loop is seamless
    tickerInner.innerHTML = pieceHtml + pieceHtml;
    // Measure synchronously — reading scrollWidth forces layout, so the scroll can be
    // (re)started without waiting on rAF. .tickerLogo carries an explicit 46px box, so
    // the width is correct even before the separator images finish decoding.
    tickerInner.style.animation = 'none';
    void tickerInner.offsetWidth; // commit the reset so the animation actually restarts
    const totalWidth = tickerInner.scrollWidth / 2;
    const pxPerSecond = speed || 90;
    const duration = Math.max(6, totalWidth / pxPerSecond);
    tickerInner.style.animation = `tickerScroll ${duration}s linear infinite`;
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fireAlert(){
    try{ passanAudio.currentTime = 0; passanAudio.play().catch(()=>{}); }catch(e){}
    alertBanner.classList.add('show');
    alertFlash.classList.add('pulse');
    setTimeout(()=>{ alertFlash.classList.remove('pulse'); }, 2800);
    setTimeout(()=>{ alertBanner.classList.remove('show'); }, 3200);
  }

  /* ---------------- Firebase RTDB live sync ----------------
     Was ntfy.sh (SSE + watchdog + polling net). ntfy.sh went unreachable, which took
     the whole overlay down with it. Now on the same house transport as the other JM
     overlays — the SDK reconnects on its own, so the watchdog/poll scaffolding is gone. */
  const FB = {
    apiKey: "AIzaSyBG2PS2muH4i27HefuLeBnZWW-TZ5dkMCw",
    databaseURL: "https://pinpoint-abf21-default-rtdb.firebaseio.com",
    projectId: "pinpoint-abf21"
  };
  const fbKey = t => t.trim().replace(/[.#$\[\]\/\s]+/g, '-');

  if(TOPIC){
    firebase.initializeApp(FB);
    firebase.database().ref(`tradedeadline/${fbKey(TOPIC)}/state`)
      .on('value', snap => { const s = snap.val(); if(s) applyState(s); });
  }

  // One quiet "arm" tap so autoplay policies don't block the Passan sound
  // the very first time it's needed. Harmless if OBS ignores it.
  window.addEventListener('load', () => {
    passanAudio.volume = 1.0;
    passanAudio.play().then(()=>{ passanAudio.pause(); passanAudio.currentTime = 0; }).catch(()=>{});
  });
</script>
</body>
</html>
